workers: 8

# 알림 설정 (M3)
alerts:
  # 연속 몇 번 실패해야 down 으로 확정할지. 1로 두면 일시적인
  # 네트워크 끊김에도 알림이 간다.
  failure_threshold: 3

  # 연속 몇 번 성공해야 up 으로 확정할지.
  success_threshold: 1

  # 같은 모니터에 다시 알림을 보내기까지의 최소 간격.
  # 플래핑하는 엔드포인트에서 알림 폭탄을 막는 마지막 방어선이다.
  cooldown: 5m

monitors:
  # ── http: 상태 코드 · 본문 키워드 ──
  - name: Google
    type: http
    target: https://www.google.com
    interval_sec: 60
    timeout_ms: 5000
    expected_status: 200

  - name: GitHub
    type: http
    target: https://github.com
    interval_sec: 60
    timeout_ms: 5000
    expected_status: 200

  - name: Go 공식 사이트
    type: http
    target: https://go.dev
    interval_sec: 60
    timeout_ms: 5000
    expected_status: 200
    keyword: Go          # 응답 본문에 이 문자열이 있어야 정상으로 본다

  - name: Cloudflare
    type: http
    target: https://www.cloudflare.com
    interval_sec: 60
    timeout_ms: 5000

  # 일부러 실패하는 모니터 — DOWN 출력이 어떻게 나오는지 보려고 넣어둔다
  - name: 없는 도메인
    type: http
    target: https://this-domain-does-not-exist-upcheck.invalid
    timeout_ms: 3000

  - name: 404 나는 주소
    type: http
    target: https://github.com/이런건없다-upcheck-test
    expected_status: 200

  # enabled: false 면 건너뛴다
  - name: 꺼둔 모니터
    type: http
    target: https://example.com
    enabled: false

  # ── tcp: 포트가 열려 있는지만 확인 ──
  # HTTP 를 안 하는 것(DB, 메시지 큐, SMTP)을 감시할 때 쓴다.
  # 포트를 반드시 적어야 한다 — 기본 포트를 짐작할 근거가 없다.
  - name: Google DNS (TCP)
    type: tcp
    target: 8.8.8.8:53
    interval_sec: 60
    timeout_ms: 3000

  # ── tls: 인증서 만료까지 남은 일수 ──
  # 포트를 생략하면 443 으로 본다. https:// 를 붙여 적어도 받아준다.
  # 만료가 cert_warn_days 이하로 남으면 '경고'가 뜬다 — 실패가 아니다.
  # 인증서가 30일 뒤에 만료돼도 서비스는 지금 멀쩡히 돌고 있기 때문이다.
  - name: GitHub 인증서
    type: tls
    target: github.com
    interval_sec: 3600
    timeout_ms: 5000
    cert_warn_days: 30

  # ── dns: 레코드가 기대값으로 해석되는지 ──
  # DNS 가 엉뚱한 곳을 가리키는 사고는 서버가 멀쩡해도 서비스를 죽인다.
  # HTTP 체크로는 안 잡힌다 — 엉뚱한 서버가 200 을 잘 돌려주기 때문이다.
  #
  # record: A, AAAA, CNAME, TXT, MX, NS (기본 A)
  # expect: 기대하는 값들. 하나라도 나오면 정상. 비우면 "해석만 되면 정상".
  # resolver: 쓸 DNS 서버 (예: 8.8.8.8:53). 비우면 시스템 기본값.
  - name: Google DNS 레코드
    type: dns
    target: dns.google
    record: A
    expect:
      - 8.8.8.8
      - 8.8.4.4
    interval_sec: 300
    timeout_ms: 3000
