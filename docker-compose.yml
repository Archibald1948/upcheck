# upcheck 전체 스택.

services:
  upcheck:
    build:
      context: .
    restart: unless-stopped
    environment:
      # 로그·-report 출력용. 저장은 언제나 UTC 다.
      TZ: Asia/Seoul
    volumes:
      # SQLite 파일은 이름 있는 볼륨에 둔다. 컨테이너를 다시 만들어도 남는다.
      - upcheck-data:/data
      # 설정은 호스트에서 읽기 전용으로 붙인다. 고치고 컨테이너만 재시작하면 된다.
      - ./configs:/etc/upcheck:ro
    expose:
      - "8484"   # API — web 컨테이너만 부른다
      - "8485"   # 운영 — Prometheus 가 있다면 여기를 긁는다
    healthcheck:
      test: ["CMD", "/usr/local/bin/upcheck", "-healthcheck", "-admin", "127.0.0.1:8485"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      # 실행 시점에 읽는다 (빌드 시점에 박히는 NEXT_PUBLIC_ 이 아니다).
      UPCHECK_API_URL: http://upcheck:8484
      UPCHECK_TIMEZONE: Asia/Seoul
    ports:
      - "3000:3000"
    depends_on:
      upcheck:
        condition: service_healthy

volumes:
  upcheck-data:
